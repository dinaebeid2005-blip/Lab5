
<!DOCTYPE html>
<html>
<head>
    <title>Books Above Average Price</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Books Above Average Price</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Book Title</th>
            <th>Price</th>
            <th>Library Average Price</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.price }}</td>
            <td>{{ book.average_price }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Back to Home</a>

</body>
</html>
