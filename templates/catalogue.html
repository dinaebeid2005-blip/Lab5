<!DOCTYPE html>
<html>
<head>
    <title>Book Catalogue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Book Catalogue</h1>

    <table border="1">
        <tr>
            <th>Book ID</th>
            <th>Title</th>
            <th>Price</th>
            <th>Publish Year</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Category</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.book_id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.price }}</td>
            <td>{{ book.publish_year }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.publisher }}</td>
            <td>{{ book.category }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="7">No books available.</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
